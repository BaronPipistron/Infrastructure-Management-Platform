name: Reconciler Service CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ReconcilerSvc/pyproject.toml

      - name: Install dependencies
        working-directory: ReconcilerSvc
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate syntax
        working-directory: ReconcilerSvc
        run: python -m compileall app tests

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ReconcilerSvc/pyproject.toml

      - name: Install dependencies
        working-directory: ReconcilerSvc
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: ReconcilerSvc
        run: pytest -q
