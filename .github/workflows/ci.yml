name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci_inventory:
    name: ci-inventory
    uses: ./.github/workflows/ci-inventory.yml

  ci_parser:
    name: ci-parser
    uses: ./.github/workflows/ci-parser.yml

  ci_reconciler:
    name: ci-reconciler
    uses: ./.github/workflows/ci-reconciler.yml

  ci_drift_detector:
    name: ci-drift-detector
    uses: ./.github/workflows/ci-drift-detector.yml
