server:
  host: 0.0.0.0
  port: 8080

logging:
  level: info

detection:
  interval: 30s
  enabledComponents:
    - node_exporter
    - cadvisor

antiSpam:
  reconcileCooldown: 2m

clients:
  inventory:
    baseURL: http://inventory-svc:8080
    hostsPath: /api/v1/hosts
    timeout: 5s
    retry:
      maxAttempts: 2
      backoff: 300ms
  parser:
    baseURL: http://parser-svc:8080
    desiredStatePath: /api/v1/desired-state
    timeout: 5s
    retry:
      maxAttempts: 2
      backoff: 300ms
  reconciler:
    baseURL: http://reconciler-svc:8082
    reconcilePath: /api/v1/reconcile
    timeout: 5s
    retry:
      maxAttempts: 2
      backoff: 300ms
