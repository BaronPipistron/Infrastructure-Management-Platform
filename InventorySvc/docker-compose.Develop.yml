version: "3.9"

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

  inventory-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-svc
    depends_on:
      - cadvisor
    environment:
      APP_CONFIG_PATH: /etc/inventory-svc/configs/appsettings.Develop.yml
    volumes:
      - ./configs:/etc/inventory-svc/configs:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
